<title>Casa Analítica Plataforma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Layout: identidade do painel de referência — cabeçalho e hero em azul profundo com ondas finas,
   páginas claras com cards brancos de sombra suave, títulos com traço roxo curto.
   Visual único (claro com faixas escuras) por escolha da marca. */
:root{
  --deep:#0B1F3B; --navy2:#081834; --blue:#2563EB; --teal:#00C2A8; --purple:#7C3AED; --gray:#E5E7EB; --cyan:#22D3EE;
  --bg:#F5F7FB; --surface:#FFFFFF; --surface2:#EEF2F9; --ink:#0B1F3B; --muted:#55627A; --line:#E5E7EB;
  --blue-soft:#E3ECFF; --teal-soft:#DDF7F3; --purple-soft:#EEE6FE;
  --ok:#047857; --ok-soft:#D1FAE5; --warn:#B45309; --warn-soft:#FEF3C7; --bad:#B91C1C; --bad-soft:#FEE2E2;
  --side-ink:#C9D6EC; --footer:#001233; --footer-ink:#8A9BB8;
  --shadow:0 1px 2px rgba(11,31,59,.04),0 8px 24px rgba(11,31,59,.07);
  --grad-cta:linear-gradient(135deg,#2563EB 0%,#7C3AED 100%);
  --display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;color:var(--deep)}
h1{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:700} h3{font-size:1rem;font-weight:700}
p{margin:0} a{color:var(--blue)} button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.container{max-width:1120px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.grid.f3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.muted{color:var(--muted)} .note{font-size:.82rem;color:var(--muted)}
.eyebrow{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.title{display:inline-flex;flex-direction:column;gap:9px}
.title::after{content:"";width:34px;height:3px;border-radius:2px;background:var(--purple)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
a.card,button.card{color:inherit;text-decoration:none;text-align:left;font:inherit}
a.card:hover h3,button.card:hover h3{color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 18px;font-weight:600;background:var(--blue);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)} .btn.purple{background:var(--grad-cta)} .btn.ghost{background:var(--surface);color:var(--blue);border:1px solid var(--line)}
.btn.dark-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3)} .btn.teal{background:#00C2A8;color:#0B1F3B}
.btn.sm{padding:6px 12px;font-size:.85rem} .btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;max-width:100%;line-height:1.35}
.ok{background:var(--ok-soft);color:var(--ok)} .info{background:var(--blue-soft);color:var(--blue)} .warn{background:var(--warn-soft);color:var(--warn)}
.bad{background:var(--bad-soft);color:var(--bad)} .ai{background:var(--purple-soft);color:var(--purple)} .off{background:var(--surface2);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--teal))}
.price{font-family:var(--display);font-weight:800;font-size:1.55rem;color:var(--deep)}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0} .field label,.lbl{font-weight:600;font-size:.86rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin:0} .kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.table{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.alert{border-radius:10px;padding:10px 14px;font-size:.9rem}

/* barra de demonstração */
.demo{background:#FEF3C7;color:#6B4A07;font-size:.82rem;padding-block:8px}
.demo .container{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.demo select{width:auto;padding:5px 8px;font-size:.85rem;background:#fff}
.demo button{background:none;border:0;color:#6B4A07;text-decoration:underline;font-size:.82rem;padding:0}

/* marca */
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.wordmark b{font-family:var(--display);font-weight:700;line-height:1.02;display:block;font-size:1rem;letter-spacing:-.01em}

/* cabeçalho do site */
.site-header{background:var(--deep);position:sticky;top:env(safe-area-inset-top,0px);z-index:10;border-bottom:1px solid rgba(255,255,255,.06)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--deep)}
.site-header .container{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-left:auto}
.nav a{color:var(--side-ink);text-decoration:none;font-weight:500;font-size:.92rem}
.nav a:hover,.nav a[aria-current="page"]{color:#fff} .nav a.btn{color:#fff}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(60% 90% at 85% 85%,rgba(124,58,237,.38),transparent 60%),radial-gradient(50% 70% at 8% 0%,rgba(37,99,235,.25),transparent 60%),linear-gradient(180deg,#0B1F3B,#081834)}
.hero svg.waves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .container{position:relative;padding-block:64px}
.hero h1{color:#fff;font-size:clamp(1.9rem,4.2vw,2.9rem)}
.hero p{color:var(--side-ink);max-width:52ch}
.band{position:relative;overflow:hidden;background:linear-gradient(180deg,#0B1F3B,#081834);color:#fff}
.band .container{position:relative;padding-block:48px;display:flex;justify-content:center}
.lockup{display:inline-flex;flex-direction:column;align-items:center;gap:16px}
.lockup .lr{display:flex;align-items:center;gap:20px}
.lockup .dv{width:2px;align-self:stretch;background:rgba(255,255,255,.75);margin-block:8px}
.lockup .nm b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(2rem,6vw,3.4rem);line-height:1;letter-spacing:-.02em;color:#fff}
.lockup .tg{font-size:.76rem;letter-spacing:.42em;text-transform:uppercase;color:var(--side-ink);text-align:center}
.section{padding-block:40px;display:flex;flex-direction:column;gap:22px}
.icon{width:28px;height:28px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* rodapé */
.footer{background:var(--footer);color:var(--footer-ink);margin-top:56px}
.footer .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;padding-block:44px 22px}
.footer h2{color:#fff;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
.footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.footer a{color:var(--footer-ink);text-decoration:none} .footer a:hover{color:#fff}
.footer .legal{border-top:1px solid #13284d;padding-block:16px 26px;font-size:.8rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* áreas logadas */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,#0B1F3B,#081834);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{color:var(--side-ink);text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:500;white-space:nowrap}
.side nav a:hover{background:#16305A;color:#fff}
.side nav a[aria-current="page"]{background:#16305A;color:#fff;box-shadow:inset 3px 0 0 #7C3AED}
.side .who{margin-top:auto;font-size:.8rem;color:#8EA2C2;display:flex;flex-direction:column;gap:6px}
.side .who strong{color:#fff} .side .who a{color:#8EA2C2}
.main{padding-block:28px 64px;min-width:0}
.main .wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
details.mod{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;box-shadow:var(--shadow)}
details.mod summary{cursor:pointer;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;list-style:none}
details.mod summary::-webkit-details-marker{display:none}
details.mod[open] summary{border-bottom:1px solid var(--line)}
.lesson{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit}
.lesson:first-child{border-top:0} button.lesson:hover{background:var(--surface2)} .lesson[disabled]{cursor:default}
.player{aspect-ratio:16/9;max-width:100%;border-radius:var(--r);overflow:hidden;position:relative;display:grid;place-items:center;color:#fff;background:radial-gradient(70% 90% at 85% 100%,rgba(124,58,237,.5),transparent 60%),radial-gradient(60% 70% at 0% 0%,rgba(37,99,235,.4),transparent 60%),#0B1F3B}
.play{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.95);border:0;display:grid;place-items:center}
.play svg{width:22px;height:22px;margin-left:4px;fill:#0B1F3B}
.player .cap{position:absolute;left:16px;right:16px;bottom:12px;display:flex;justify-content:space-between;font-size:.8rem;color:var(--side-ink)}
.choice{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.choice input{width:auto;margin-top:4px}
.choice.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),var(--shadow)}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
.tile .v{font-family:var(--display);font-weight:800;font-size:1.35rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;font-weight:500;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.comment{display:flex;flex-direction:column;gap:6px}
.reply{margin-left:24px;padding-left:12px;border-left:2px solid var(--line)}
.link-btn{background:none;border:0;padding:0;color:var(--blue);font:inherit;font-size:.82rem;cursor:pointer}
.material{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;flex-wrap:wrap}
.pdf-ic{width:34px;height:40px;border-radius:6px;background:#FEE2E2;color:#B91C1C;display:grid;place-items:center;font-size:.65rem;font-weight:700;flex:none}
.modal{position:fixed;inset:0;background:rgba(11,31,59,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:#fff;border-radius:var(--r);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet{position:relative;aspect-ratio:1/1.414;width:100%;max-width:420px;margin:0 auto;border:1px solid var(--line);background:#fff;overflow:hidden;padding:22px 20px;font-size:.62rem;color:#334}
.sheet .wm{position:absolute;left:50%;transform:translate(-50%,-50%) rotate(-30deg);white-space:nowrap;font-weight:700;color:rgba(11,31,59,.12);font-size:.95rem}
.sheet .ft{position:absolute;left:0;right:0;bottom:0;padding:4px 10px;font-size:.5rem;color:#556;background:rgba(255,255,255,.9);border-top:1px solid #eee}
.lockbar{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.asaas{max-width:460px;margin:0 auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--shadow);overflow:hidden}
.asaas .top{background:#0030B9;color:#fff;padding:14px 18px;font-weight:600}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;padding:12px 16px;gap:10px;min-width:0}.side nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}.side nav::-webkit-scrollbar{display:none}.side .who{flex-direction:row;flex-wrap:wrap;gap:12px}}
@media (max-width:700px){.footer .cols{grid-template-columns:1fr;gap:22px}.site-header .container{gap:10px 12px}.cta{margin-left:auto}.nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;gap:16px;scrollbar-width:none;padding-bottom:2px}.nav::-webkit-scrollbar{display:none}.nav a{white-space:nowrap}.hero .container{padding-block:40px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
</style>

<div class="demo gutter"><div class="container">
  <span><b>Navegação de demonstração</b> · dados fictícios · data simulada 15/03/2027</span>
  <span class="row" style="gap:8px"><label for="persona">Ver como</label>
    <select id="persona"></select>
    <button type="button" id="reset">Reiniciar</button></span>
</div></div>
<div id="root"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== Dados de exemplo ===================== */
const DAY=864e5, D=(y,m,d)=>Date.UTC(y,m-1,d,12);
const NOW=D(2027,3,15), PREVIEW_AT=D(2027,1,1), WEEKLY_FROM=D(2027,2,1);
const brl=c=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmt=(t,o={day:"2-digit",month:"2-digit",year:"numeric"})=>t==null?"—":new Date(t).toLocaleDateString("pt-BR",{...o,timeZone:"UTC"});
const addM=(t,n)=>{const d=new Date(t);d.setUTCMonth(d.getUTCMonth()+n);return d.getTime()};
const dur=m=>m>=60?`${Math.floor(m/60)}h${m%60?String(m%60).padStart(2,"0"):""}`:`${m} min`;
const PLAY='<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const CATALOG=[
 ["negocios", "Negócios & Analytics", "#2563EB", "Negócio, indicadores, análise e tomada de decisão.", [["Fundamentos de negócios e análise", ["Modelos de negócio e unit economics", "Perguntas de negócio e hipóteses", "Tipos de dados, granularidade e chaves", "Projeto aplicado: diagnóstico de um negócio"]], ["SQL para análise", ["SELECT, filtros e agregações", "JOINs sem duplicar linhas", "Funções de janela na prática", "Projeto aplicado: base de clientes"]], ["Indicadores e finanças do negócio", ["Como desenhar um KPI", "Árvore de métricas", "DRE, margem e indicadores financeiros", "Projeto aplicado: painel de indicadores"]], ["Visualização e storytelling", ["Escolher o gráfico certo", "Power BI: modelagem e DAX essencial", "Storytelling com dados para executivos", "Projeto aplicado: dashboard executivo"]], ["Decisão orientada por dados", ["Testes A/B para negócio", "Coortes e retenção", "Precificação e elasticidade", "Projeto final: recomendação para a diretoria"]]]],
 ["engenharia", "Engenharia de Dados & Cloud", "#00C2A8", "Pipelines, arquitetura, integração e infraestrutura.", [["Fundamentos de engenharia", ["Arquitetura de dados moderna", "Python para engenharia", "Git e versionamento", "Projeto aplicado: primeiro pipeline"]], ["Modelagem e armazenamento", ["Modelagem dimensional", "Data lake, warehouse e lakehouse", "Parquet e particionamento", "Projeto aplicado: modelo estrela"]], ["Pipelines e orquestração", ["ETL ou ELT: quando usar cada um", "Airflow: DAGs e agendamento", "dbt: transformação testada", "Projeto aplicado: pipeline orquestrado"]], ["Cloud na prática", ["BigQuery e custo de consulta", "Armazenamento e permissões (IAM)", "Streaming com Pub/Sub", "Projeto aplicado: ingestão em tempo real"]], ["Qualidade e operação", ["Testes e contratos de dados", "Observabilidade de pipelines", "Docker e CI/CD para dados", "Projeto final: plataforma de dados"]]]],
 ["ciencia", "Ciência de Dados & Inteligência Artificial", "#7C3AED", "Estatística aplicada, modelos preditivos e deep learning.", [["Estatística aplicada", ["Distribuições e incerteza", "Inferência e intervalos de confiança", "Testes de hipótese sem armadilhas", "Projeto aplicado: análise exploratória"]], ["Machine learning supervisionado", ["Regressão e regularização", "Classificação e métricas", "Árvores, florestas e boosting", "Projeto aplicado: modelo de churn"]], ["Validação e features", ["Validação cruzada e vazamento de dados", "Engenharia de features", "Séries temporais e previsão de demanda", "Projeto aplicado: previsão de vendas"]], ["Deep learning", ["Redes neurais com PyTorch", "Visão computacional", "Processamento de linguagem e transformers", "Projeto aplicado: classificador de imagens"]], ["Técnicas avançadas", ["Clusterização e segmentação", "Sistemas de recomendação", "Inferência causal", "Projeto final: modelo para decisão de negócio"]]]],
 ["mlops", "MLOps", "#4F46E5", "Modelos de machine learning em produção, do treino ao monitoramento.", [["Fundamentos de MLOps", ["Ciclo de vida de modelos em produção", "Versionamento de código, dados e modelos", "Ambientes reprodutíveis com Docker", "Projeto aplicado: projeto de ML reprodutível"]], ["Experimentos e registro", ["Rastreio de experimentos com MLflow", "Registro e versionamento de modelos", "Feature store na prática", "Projeto aplicado: pipeline de treino rastreado"]], ["Pipelines e automação", ["Pipelines de treino com Airflow", "CI/CD para modelos com GitHub Actions", "Testes de dados e de modelos", "Projeto aplicado: treino automatizado"]], ["Deploy e serving", ["APIs de modelo com FastAPI", "Inferência em lote e em tempo real", "Otimização com ONNX", "Projeto aplicado: modelo servido em produção"]], ["Monitoramento e operação", ["Métricas com Prometheus e Grafana", "Drift de dados e de conceito", "Retreino e governança de modelos", "Projeto final: plataforma de MLOps de ponta a ponta"]]]],
 ["ia", "Engenharia de IA", "#06B6D4", "Aplicações com LLMs: RAG, agentes, avaliação e produção.", [["Fundamentos de LLMs", ["Como funcionam os grandes modelos de linguagem", "Engenharia de prompts para aplicações", "APIs de modelos e custo de uso", "Projeto aplicado: assistente com prompts estruturados"]], ["RAG e busca semântica", ["Embeddings e bancos vetoriais", "Chunking, indexação e recuperação", "Avaliação da qualidade do RAG", "Projeto aplicado: assistente sobre documentos"]], ["Agentes e ferramentas", ["Chamada de funções e uso de ferramentas", "Agentes e fluxos multiagente", "Memória e orquestração", "Projeto aplicado: agente que executa tarefas"]], ["Avaliação e segurança", ["Avaliações automatizadas (evals)", "Guardrails, privacidade e LGPD", "Prompt injection e segurança de aplicações", "Projeto aplicado: suíte de avaliação"]], ["IA em produção", ["Latência, cache e custo", "Observabilidade de aplicações de IA", "Fine-tuning: quando vale a pena", "Projeto final: produto de IA em produção"]]]],
 ["gestao", "Gestão Estratégica de Dados & IA", "#0B1F3B", "Governança, liderança, estratégia e geração de valor.", [["Estratégia de dados", ["Dados como ativo de negócio", "Maturidade analítica", "Casos de uso e priorização", "Projeto aplicado: mapa de oportunidades"]], ["Governança", ["Papéis, donos e catálogo", "Qualidade de dados como processo", "LGPD na prática", "Projeto aplicado: política de governança"]], ["Liderança de times de dados", ["Estrutura de times", "Contratar e desenvolver talentos", "Gestão de projetos analíticos", "Projeto aplicado: plano de time"]], ["IA nos negócios", ["O que a IA resolve e o que não resolve", "ROI de projetos de IA", "Riscos, ética e regulação", "Projeto aplicado: business case de IA"]], ["Geração de valor", ["Métricas de valor de dados", "Comunicação com executivos", "Cultura orientada a dados", "Projeto final: roadmap de dados e IA"]]]]
];
const F=CATALOG.map(([id,name,color,summary,mods])=>{
  let k=0;const modules=mods.map(([title,ls],mi)=>({pos:mi+1,title,preview:mi===0,lessons:ls.map((t,li)=>{
    const proj=t.startsWith("Projeto");const L={id:`${id}-${mi}-${li}`,f:id,mi,li,title:t,proj,min:proj?180:100,
      release:mi===0?PREVIEW_AT:WEEKLY_FROM+7*k*DAY};if(mi>0)k++;return L})}));
  return {id,name,color,summary,modules,lessons:modules.flatMap(m=>m.lessons)};

function split(total,n){const b=Math.floor(total/n);const a=Array(n).fill(b);a[n-1]+=total-b*n;return a}
function mkContract(id,user,plan,all,formation,activated,n,method,paid,overdue=0,price){
  const P=seedPlans()[plan];price=price??(all?Math.round(P.price*1.95):P.price);
  return {id,user,plan,all,formation,price,credit:0,n,method,status:"ativo",activated,end:P.months?addM(activated,P.months):null,
    parcels:split(price,n).map((v,i)=>({n:i+1,v,due:addM(activated,i),status:i<paid?"paga":i<paid+overdue?"vencida":"pendente"}))};
}

 <section class="card"><h2 class="title">Páginas institucionais</h2><p class="muted">Quem Somos, Por onde começar, plano anual, Garantia, Privacidade e Termos são editáveis aqui no app real.</p>
 <div class="row">${Object.entries(PAGES).map(([k,[t]])=>`<a class="btn ghost sm" href="#${k}">${t}</a>`).join("")}</div></section>
 <section class="card"><h2 class="title">Novo episódio do vlog</h2><div class="field"><label for="vl-t">Título</label><input id="vl-t"></div><div class="field"><label for="vl-x">Resumo</label><input id="vl-x"></div><div><button class="btn sm" data-vlog>Publicar episódio</button></div></section>`)}
function pgAuditoria(){const g=guard("admin");if(g)return g;
 return shell("admin","admin-auditoria",`<h1>Auditoria</h1><div class="table"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Registro</th></tr></thead><tbody>${db.audit.map(a=>`<tr><td class="num">${fmt(a.at)}</td><td>${esc(a.who)}</td><td>${a.action}</td><td>${esc(a.what)}</td></tr>`).join("")}</tbody></table></div>`)}

/* ===================== Roteamento ===================== */
const root=document.getElementById("root");
function render(keep){
 const h=(location.hash||"#inicio").slice(1);let html;
 if(h==="inicio"||!h)html=pgInicio();
 else if(h==="cursos")html=pgCursos();
 else if(h.startsWith("curso-"))html=pgCurso(h.slice(6));
 else if(h==="planos")html=pgPlanos();
 else if(h==="checkout")html=pgCheckout();
 else if(PAGES[h])html=pgInst(h);
 else if(h==="trilhas")html=pgTrilhas();
 else if(h==="vlog")html=pgVlog();
 else if(h.startsWith("vlog-"))html=pgVlogPost(Number(h.slice(5)));
 else if(h.startsWith("trilha-"))html=pgTrilha(h.slice(7));
 else if(h==="ebooks")html=pgEbooks();
 else if(h==="fale-conosco")html=pgContato();
 else if(h==="entrar")html=pgEntrar();
 else if(h==="aluno")html=pgAluno();
 else if(h.startsWith("aluno-formacao-"))html=pgAlunoFormacao(h.slice(15));
 else if(h==="aula")html=pgAula();
 else if(h==="aluno-plano")html=pgAlunoPlano();
 else if(h==="aluno-resumao")html=pgAlunoResumao();
 else if(h==="aluno-perfil")html=pgAlunoPerfil();
 else if(h==="forum")html=pgForum();
 else if(h==="forum-topico")html=pgTopico();
 else if(h==="professor")html=pgProfessor();
 else if(h.startsWith("professor-formacao-"))html=pgProfFormacao(h.slice(19));
 else if(h==="professor-resumao")html=pgProfResumao();
 else if(h==="suporte")html=pgSuporte();
 else if(h==="suporte-aluno")html=pgSuporteAluno();
 else if(h==="suporte-cobrancas")html=pgCobrancas();
 else if(h==="suporte-reembolsos")html=pgReembolsos();
 else if(h==="suporte-mensagens")html=pgMensagens();
 else if(h==="admin")html=pgAdmin();
 else if(h==="admin-usuarios")html=pgUsuarios();
 else if(h==="admin-planos")html=pgAdminPlanos();
 else if(h==="admin-conteudo")html=pgConteudo();
 else if(h==="admin-auditoria")html=pgAuditoria();
 else html=pgInicio();
 root.innerHTML=html+(ui.modal||"");if(!keep)window.scrollTo(0,0);save();
}
const go=(h,keep)=>{if(location.hash==="#"+h)render(keep);else location.hash=h};
const sel=document.getElementById("persona");
sel.innerHTML=Object.entries(PERSONAS).map(([k,[l]])=>`<option value="${k}">${l}</option>`).join("");sel.value=persona;
sel.addEventListener("change",()=>{persona=sel.value;ui.invoice=null;ui.modal=null;save();toast("Agora você vê como: "+PERSONAS[persona][0]);go(PERSONAS[persona][2])});
document.getElementById("reset").addEventListener("click",()=>{db=seed();ui={lesson:null,checkout:null,invoice:null,student:"ana"};save();toast("Demonstração reiniciada");render()});
window.addEventListener("hashchange",()=>{ui.modal=null;render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.modal){ui.modal=null;render(true)}});

root.addEventListener("click",e=>{const t=e.target.closest("[data-close],[data-cdel],[data-chide],[data-newtopic],[data-fspace],[data-fstatus],[data-topic],[data-tact],[data-accept],[data-phide],[data-voriginal],[data-vremove],[data-mremove],[data-play],[data-material],[data-checkout],[data-preview],[data-lesson],[data-done],[data-login],[data-pay],[data-cancel-invoice],[data-refund],[data-upgrade],[data-addon],[data-student],[data-approve],[data-deny],[data-msg],[data-grant],[data-revoke],[data-instr],[data-save-plan],[data-save-settings],[data-vlog],[data-save-lesson],[data-ebook]");if(!t)return;const d=t.dataset;const u=me();
 if(d.play!==undefined){toast("Na demonstração não há vídeo. No app real, o player toca a aula pelo Bunny Stream com link assinado.");return}
 if(d.close!==undefined){ui.modal=null;render(true);return}
 if(d.material){const [mid,title]=d.material.split("|");const c=db.cpf[u.id];
  if(!c){ui.needCpf=true;toast("Informe seu CPF em Meus dados para baixar materiais.");go("aluno-perfil");return}
  const stamp=`${u.name} · CPF ${fmtCpf(c)}`,foot=`Licenciado para ${u.name} · CPF ${fmtCpf(c)} · ${u.email} · ${fmt(NOW)} 10:42`;
  db.audit.unshift({at:NOW,who:u.email,action:"material_baixado",what:title});
  ui.modal=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="box"><h2 id="mtitle">${esc(title)}.pdf</h2>
  <p class="muted">No app real, o download começa na hora com esta marca d'água em todas as páginas, e fica registrado.</p>
  <div class="sheet"><strong style="font-size:.8rem;color:#0B1F3B">${esc(title)}</strong>${Array.from({length:14},()=>"<p style=\"margin:6px 0\">Conteúdo da aula em PDF com exemplos, exercícios e referências.</p>").join("")}
  ${[22,50,78].map(y=>`<span class="wm" style="top:${y}%">${esc(stamp)}</span>`).join("")}<div class="ft">${esc(foot)}</div></div>
  <div><button class="btn" data-close>Fechar</button></div></div></div>`;render(true);return}
 if(d.cdel){db.comments=db.comments.filter(c=>c.id!==d.cdel&&c.parent!==d.cdel);toast("Comentário excluído");render(true);return}
 if(d.chide){const c=db.comments.find(x=>x.id===d.chide);c.hidden=true;audit("comentario_ocultado",c.body.slice(0,40));toast("Comentário ocultado para os alunos");render(true);return}
 if(d.newtopic!==undefined){ui.newTopic=!ui.newTopic;render(true);return}
 if(d.fspace){ui.fspace=d.fspace;render(true);return}
 if(d.fstatus){ui.fstatus=d.fstatus;render(true);return}
 if(d.topic){ui.topic=d.topic;go("forum-topico");return}
 if(d.tact){const tp=db.topics.find(x=>x.id===ui.topic);const a=d.tact;if(a==="resolver")tp.status="resolvido";if(a==="reabrir"){tp.status="aberto";tp.accepted=null}if(a==="fixar")tp.pinned=true;if(a==="desafixar")tp.pinned=false;if(a==="ocultar"){tp.hidden=true;audit("topico_ocultado",tp.title)}toast("Tópico atualizado");render(true);return}
 if(d.accept){const tp=db.topics.find(x=>x.id===ui.topic);tp.accepted=d.accept;tp.status="resolvido";toast("Melhor resposta marcada. Tópico resolvido.");render(true);return}
 if(d.phide){db.posts.find(p=>p.id===d.phide).hidden=true;audit("resposta_ocultada",ui.topic);toast("Resposta ocultada");render(true);return}
 if(d.voriginal){toast("No app real, o original baixa por um link assinado de 10 minutos. Só professor e admin têm acesso.");audit("video_original_baixado",lessonById(d.voriginal).title);return}
 if(d.vremove){db.videos[d.vremove]=false;audit("video_removido",lessonById(d.vremove).title);toast("Vídeo removido");render(true);return}
 if(d.mremove){const [lid,mid]=d.mremove.split("|");db.materials[lid]=(db.materials[lid]||[]).filter(m=>m.id!==mid);toast("Material removido");render(true);return}
 if(d.checkout!==undefined){const [p,scope,f]=d.checkout.split("|");ui.checkout={plan:p,scope,formation:f||"ciencia",method:"cartao",n:12};ui.invoice=null;go("checkout");return}
 if(d.preview){if(!u){toast("Crie sua conta (ou entre) para assistir ao módulo 1");go("entrar");return}go("aluno-formacao-"+d.preview);return}
 if(d.lesson){ui.lesson=d.lesson;go("aula");return}
 if(d.done){const s=done(u.id);s.has(d.done)?s.delete(d.done):s.add(d.done);db.progress[u.id]=[...s];toast(s.has(d.done)?"Aula concluída":"Aula marcada como não concluída");render(true);return}
 if(d.login){persona=d.login;sel.value=persona;toast("Entrou como "+PERSONAS[persona][0]);go(ui.checkout?"checkout":PERSONAS[persona][2]);return}
 if(d.pay!==undefined){const c=ui.checkout,p=plan(c.plan);const total=c.scope==="todas"?bundle(p):p.price;
  db.contracts.push({id:"c-"+Date.now(),user:u.id,plan:p.code,all:c.scope==="todas",formation:c.scope==="todas"?null:c.formation,price:total,credit:0,n:c.n,method:c.method,status:"ativo",activated:NOW,end:p.months?addM(NOW,p.months):null,
   parcels:split(total,c.n).map((v,i)=>({n:i+1,v,due:addM(NOW,i),status:i===0?"paga":"pendente"}))});
  audit("contrato_ativado",`${p.name}${c.scope==="todas"?" (todas)":""} · ${u.name}`);ui.invoice=null;ui.checkout=null;toast("Pagamento aprovado. Matrícula liberada.");go("aluno");return}
 if(d.cancelInvoice!==undefined){ui.invoice=null;render();return}
 if(d.refund){db.refunds.push({id:"r-"+Date.now(),contract:d.refund,user:u.id,reason:(document.getElementById("rf-reason")||{}).value||"",status:"solicitado",at:NOW});audit("reembolso_solicitado",u.name);toast("Pedido registrado. A equipe confirma em até 2 dias úteis.");render(true);return}
 if(d.upgrade!==undefined){const c=activeOf(u.id);const o=upgradeOptions(c).find(x=>x.key===ui.up);if(!o)return;
  c.parcels.forEach(x=>{if(x.status==="pendente"||x.status==="vencida")x.status="cancelada"});c.status="substituido";
  const n=o.due?12:0;db.contracts.push({id:"c-"+Date.now(),user:u.id,plan:o.p.code,all:o.all,formation:o.all?null:c.formation,price:o.price,credit:Math.min(o.credit,o.price),n:n||1,method:"cartao",status:"ativo",activated:NOW,end:o.p.months?addM(NOW,o.p.months):null,
   parcels:o.due?split(o.due,12).map((v,i)=>({n:i+1,v,due:addM(NOW,i),status:i===0?"paga":"pendente"})):[]});
  audit("upgrade_ativado",`${plan(c.plan).name} → ${o.p.name}${o.all?" (todas)":""} · ${u.name}`);toast("Upgrade confirmado. Acesso reiniciado.");render(true);return}
 if(d.addon){const a=db.addons.find(x=>x.user===u.id&&x.code==="resumao"&&x.status!=="cancelada");if(d.addon==="off"&&a){a.status="cancelada";toast("Complemento cancelado")}else if(d.addon==="on"){db.addons.push({user:u.id,code:"resumao",status:"ativa",since:NOW});toast("Resumão Guiado ativado (simulação)")}render(true);return}
 if(d.student){ui.student=d.student;if(location.hash!=="#suporte-aluno"){e.preventDefault();go("suporte-aluno")}return}
 if(d.approve){const r=db.refunds.find(x=>x.id===d.approve);const c=db.contracts.find(x=>x.id===r.contract);c.parcels.forEach(x=>{x.status=x.status==="paga"?"estornada":x.status==="pendente"||x.status==="vencida"?"cancelada":x.status});
  c.status="reembolsado";c.end=NOW;r.status="concluido";db.addons.filter(a=>a.user===r.user).forEach(a=>a.status="cancelada");audit("reembolso_concluido",userBy(r.user).name);toast("Reembolso concluído: estorno enviado ao Asaas e acesso encerrado.");render(true);return}
 if(d.deny){const r=db.refunds.find(x=>x.id===d.deny);r.status="recusado";r.note=document.getElementById("deny-"+r.id).value||"Fora das condições da garantia.";audit("reembolso_recusado",userBy(r.user).name);toast("Pedido recusado");render(true);return}
 if(d.msg){const [id,st]=d.msg.split("|");db.messages.find(m=>m.id===id).status=st;render(true);return}
 if(d.grant){const usr=userBy(d.grant);const r=document.getElementById("g-"+usr.id).value;if(r&&!usr.roles.includes(r)){usr.roles.push(r);audit("perfil_concedido",`${ROLE_LABEL[r]} · ${usr.name}`);toast(`${ROLE_LABEL[r]} concedido a ${usr.name}`)}render(true);return}
 if(d.revoke){const [id,r]=d.revoke.split("|");const usr=userBy(id);usr.roles=usr.roles.filter(x=>x!==r);audit("perfil_removido",`${ROLE_LABEL[r]} · ${usr.name}`);toast(`${ROLE_LABEL[r]} removido`);render(true);return}
 if(d.instr){const usr=userBy(d.instr);const f=document.getElementById("i-"+usr.id).value;db.instructors[f]=[...new Set([...(db.instructors[f]||[]),usr.id])];if(!usr.roles.includes("professor"))usr.roles.push("professor");audit("professor_atribuido",`${fById(f).name} · ${usr.name}`);toast(`${usr.name} agora leciona ${fById(f).name}`);render(true);return}
 if(d.savePlan){const p=plan(d.savePlan);const v=Number(document.getElementById("pp-"+p.code).value.replace(/\./g,"").replace(",","."));const m=Number(document.getElementById("pm-"+p.code).value.replace(",","."));
  if(!(v>0)||!(m>=1)){toast("Preço ou multiplicador inválido");return}p.price=Math.round(v*100);p.mult=m;const s=document.getElementById("ps-"+p.code);if(s)p.seats=Number(s.value)||p.seats;audit("plano_alterado",p.name);toast(p.name+" salvo");render(true);return}
 if(d.saveSettings!==undefined){db.settings.whatsapp=document.getElementById("st-w").value;db.settings.email=document.getElementById("st-e").value;audit("configuracao_alterada","Site");toast("Configurações salvas");render(true);return}
 if(d.vlog!==undefined){const t=document.getElementById("vl-t").value.trim(),x=document.getElementById("vl-x").value.trim();if(t.length<3){toast("Informe o título");return}db.vlog.unshift({t,x,d:NOW});audit("vlog_publicado",t);toast("Episódio publicado");render(true);return}
 if(d.saveLesson){const l=lessonById(d.saveLesson);const t=document.getElementById("t-"+l.id).value.trim();const r=document.getElementById("r-"+l.id).value;if(t)l.title=t;if(r&&l.mi>0){const [y,mo,da]=r.split("-").map(Number);l.release=D(y,mo,da)}audit("aula_editada",l.title);toast("Aula salva");return}
 if(d.ebook!==undefined){if(!u){toast("Crie sua conta para baixar");go("entrar")}else toast("No app real, o download sai por um link assinado de 10 minutos.");return}
});
root.addEventListener("change",e=>{const id=e.target.id||e.target.name;const c=ui.checkout;
 if(e.target.name==="scope"&&c){c.scope=e.target.value;render(true)}
 else if(id==="co-f"&&c){c.formation=e.target.value}
 else if(id==="co-m"&&c){c.method=e.target.value}
 else if(id==="co-n"&&c){c.n=Number(e.target.value);render(true)}
 else if(id==="up-opt"){ui.up=e.target.value;render(true)}
 else if(e.target.dataset.vupload){const lid=e.target.dataset.vupload,f=e.target.files[0];if(!f)return;if(!f.type.startsWith("video/")){toast("Escolha um arquivo de vídeo.");return}
  const bar=document.getElementById("vp-"+lid);bar.hidden=false;let p=0;const iv=setInterval(()=>{p+=10;bar.firstElementChild.style.width=p+"%";if(p>=100){clearInterval(iv);db.videos[lid]=true;audit("video_enviado",lessonById(lid).title);toast("Vídeo enviado. O Bunny processa em alguns minutos.");render(true)}},120)}
 else if(e.target.dataset.mupload){const lid=e.target.dataset.mupload,f=e.target.files[0];if(!f)return;
  if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){toast("Só PDF. Converta o arquivo e envie de novo.");e.target.value="";return}
  const title=(document.getElementById("mt-"+lid).value||f.name.replace(/\.pdf$/i,"")).trim();(db.materials[lid]=db.materials[lid]||[]).push({id:"m"+Date.now(),title});audit("material_anexado",title);toast("PDF anexado");render(true)}
});
root.addEventListener("submit",e=>{e.preventDefault();const f=e.target;const u=me();
 if(f.id==="checkout"){const c=ui.checkout,p=plan(c.plan);ui.invoice={total:c.scope==="todas"?bundle(p):p.price,n:c.n};render()}
 if(f.id==="contact"){db.messages.push({id:"m"+Date.now(),name:f.querySelector("#c-name").value,email:f.querySelector("#c-email").value,subject:f.querySelector("#c-subject").value,message:f.querySelector("#c-msg").value,status:"nova",at:NOW});save();f.reset();toast("Mensagem enviada. Ela aparece para o Suporte.")}
 if(f.id==="search"){ui.q=f.querySelector("#q").value;render(true)}
 if(f.dataset.cform){const [lid,parent]=f.dataset.cform.split("|");const body=f.querySelector("textarea").value.trim();if(!body)return;db.comments.push({id:"k"+Date.now(),lesson:lid,user:u.id,parent:parent||null,body,at:NOW});toast(parent?"Resposta publicada":"Comentário publicado");render(true)}
 if(f.id==="perfil"){const n=f.querySelector("#pf-n").value.trim();if(n.length>2)u.name=n;const ci=f.querySelector("#pf-c");if(ci&&!ci.disabled&&ci.value){const c=ci.value.replace(/\D/g,"");if(!validCpf(c)){toast("CPF inválido. Confira os números.");return}db.cpf[u.id]=c;ui.needCpf=false;toast("CPF salvo. Já pode baixar os materiais.");if(ui.lesson){go("aula");return}}else toast("Dados salvos");render(true)}
 if(f.id==="topic"){const t=f.querySelector("#tp-t").value.trim(),b=f.querySelector("#tp-b").value.trim();if(t.length<5){toast("O título precisa de pelo menos 5 caracteres.");return}const sv=f.querySelector("#tp-s").value;const id="t"+Date.now();db.topics.push({id,space:sv==="null"?null:sv,user:u.id,kind:f.querySelector("#tp-k").value,title:t,body:b,status:"aberto",pinned:false,accepted:null,at:NOW,hidden:false});ui.newTopic=false;ui.topic=id;toast("Tópico publicado");go("forum-topico")}
 if(f.id==="post"){const b=f.querySelector("#ps-b").value.trim();if(!b)return;db.posts.push({id:"p"+Date.now(),topic:ui.topic,user:u.id,body:b,at:NOW,hidden:false});toast("Resposta publicada");render(true)}
 if(f.id==="sess"){const fid=f.querySelector("#ss-f").value,w=Number(f.querySelector("#ss-w").value),t=f.querySelector("#ss-t").value;db.sessions=db.sessions.filter(s=>!(s.f===fid&&s.week===w));db.sessions.push({f:fid,week:w,title:t,at:NOW,status:"publicado"});audit("resumao_publicado",t);toast("Gravação salva");render(true)}
});
render();
</script>
